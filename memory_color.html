<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória de Cores - Estilo Bobbie Goods</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
            background-color: #fff4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #5a4b51;
        }

        h1 {
            margin: 10px 0;
            color: #ff85a2;
            text-shadow: 2px 2px 0px #ffe3ec;
            font-size: 2.2rem;
            text-align: center;
        }

        .header-info {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            background: white;
            padding: 10px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 2px solid #ffccd5;
        }

        .status-badge {
            color: #ff5c8a;
        }

        #game-container {
            position: relative;
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.3);
            border: 4px solid #ffb3c1;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            width: 100%;
        }

        #timer-bar-container {
            width: 100%;
            height: 14px;
            background-color: #ffe6ed;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid #ffccd5;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background-color: #ff85a2;
            transition: width 0.1s linear;
        }

        #svg-container {
            width: 100%;
            max-width: 380px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fafafa;
            border-radius: 20px;
            border: 3px dashed #ffccd5;
            padding: 10px;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 360px;
            max-height: 360px;
        }

        /* Elementos coloríveis no SVG */
        .colorable {
            cursor: pointer;
            transition: fill 0.2s ease;
            stroke: #222222;
            stroke-width: 4;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .colorable:hover {
            opacity: 0.85;
        }

        #palette {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            padding: 12px;
            background: #fff0f5;
            border-radius: 20px;
            width: 100%;
            border: 2px solid #ffccd5;
        }

        .color-swatch {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: transform 0.15s ease;
        }

        .color-swatch:hover {
            transform: scale(1.15);
        }

        .color-swatch.selected {
            transform: scale(1.25);
            border-color: #5a4b51;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .btn {
            background-color: #ff85a2;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 0px #e65c83;
            transition: all 0.1s ease;
        }

        .btn:hover {
            background-color: #ff7096;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #e65c83;
        }

        /* Overlay para mensagens e introdução */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 244, 248, 0.96);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            z-index: 10;
        }

        .overlay h2 {
            color: #ff5c8a;
            margin-bottom: 10px;
        }

        .overlay p {
            font-size: 1.05rem;
            line-height: 1.4;
            margin-bottom: 20px;
            color: #6d5962;
        }

        .hidden {
            display: none !important;
        }

</head>

            },
            // Fase 13: Câmera Retrô
            {
                name: "Câmera Retrô",
                parts: [
                    { id: 'p1', name: 'Corpo Câmera', correctColor: '#B5EAD7', type: 'rect', x: 80, y: 150, width: 240, height: 160, rx: 25 },
                    { id: 'p2', name: 'Topo Câmera', correctColor: '#FFDAC1', type: 'path', d: 'M 130 150 L 160 110 L 240 110 L 270 150 Z' },
                    { id: 'p3', name: 'Lente Anel Fora', correctColor: '#8D5B4C', type: 'circle', cx: 200, cy: 230, r: 55 },
                    { id: 'p4', name: 'Lente Centro', correctColor: '#B3C5FF', type: 'circle', cx: 200, cy: 230, r: 35 },
                    { id: 'p5', name: 'Flash', correctColor: '#FFE5A3', type: 'rect', x: 105, y: 170, width: 35, height: 25, rx: 5 },
                    { id: 'p6', name: 'Botão', correctColor: '#FF5C5C', type: 'rect', x: 100, y: 135, width: 20, height: 15, rx: 3 }
                ],
                extraDetails: `
                    <circle cx="210" cy="220" r="8" fill="#FFF" opacity="0.6"/>
                `
            },
            // Fase 14: Picolé de Verão
            {
                name: "Picolé de Verão",
                parts: [
                    { id: 'p1', name: 'Palito', correctColor: '#D7A15C', type: 'path', d: 'M 180 270 L 220 270 L 210 360 L 190 360 Z' },
                    { id: 'p2', name: 'Camada Cima', correctColor: '#FF5C5C', type: 'path', d: 'M 120 140 C 120 50 280 50 280 140 L 280 160 L 120 160 Z' },
                    { id: 'p3', name: 'Camada Meio', correctColor: '#FFE5A3', type: 'rect', x: 120, y: 160, width: 160, height: 50 },
                    { id: 'p4', name: 'Camada Baixo', correctColor: '#B5EAD7', type: 'rect', x: 120, y: 210, width: 160, height: 60, rx: 10 },
                    { id: 'p5', name: 'Bochecha E', correctColor: '#FF85A2', type: 'circle', cx: 155, cy: 185, r: 10 },
                    { id: 'p6', name: 'Bochecha D', correctColor: '#FF85A2', type: 'circle', cx: 245, cy: 185, r: 10 }
                ],
                extraDetails: `
                    <circle cx="175" cy="175" r="5" fill="#222"/>
                    <circle cx="225" cy="175" r="5" fill="#222"/>
                    <path d="M 193 185 Q 200 191 207 185" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
                `
            },
            // Fase 15: Cachorrinho na Cesta
            {
                name: "Cachorrinho Caramelo",
                parts: [
                    { id: 'p1', name: 'Cesta', correctColor: '#8D5B4C', type: 'path', d: 'M 90 220 L 310 220 L 285 340 L 115 340 Z' },
                    { id: 'p2', name: 'Cabeça Cão', correctColor: '#D7A15C', type: 'circle', cx: 200, cy: 170, r: 65 },
                    { id: 'p3', name: 'Orelha E', correctColor: '#4B382A', type: 'path', d: 'M 140 130 C 90 130 90 220 140 200 Z' },
                    { id: 'p4', name: 'Orelha D', correctColor: '#4B382A', type: 'path', d: 'M 260 130 C 310 130 310 220 260 200 Z' },
                    { id: 'p5', name: 'Focinho', correctColor: '#FFE5A3', type: 'ellipse', cx: 200, cy: 185, rx: 25, ry: 18 },
                    { id: 'p6', name: 'Nariz', correctColor: '#4B382A', type: 'ellipse', cx: 200, cy: 175, rx: 10, ry: 7 },
                    { id: 'p7', name: 'Laço Cesta', correctColor: '#FF5C5C', type: 'path', d: 'M 170 220 C 150 200 250 200 230 220 C 260 240 140 240 170 220 Z' }
                ],
                extraDetails: `
                    <circle cx="170" cy="155" r="5" fill="#222"/>
                    <circle cx="230" cy="155" r="5" fill="#222"/>
                    <path d="M 194 190 Q 200 196 206 190" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
                `
            }
        ];

        // Estado do Jogo
        let currentLevelIndex = 0;
        let selectedColor = COLOR_PALETTE[0];
        let userColors = {};
        let timerInterval = null;
        let score = 0;
        let isMemorizingPhase = false;

        // Inicializar Paleta de Cores
        function initPalette() {
            const paletteContainer = document.getElementById('palette');
            paletteContainer.innerHTML = '';
            
            COLOR_PALETTE.forEach((color, index) => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch' + (index === 0 ? ' selected' : '');
                swatch.style.backgroundColor = color;
                swatch.onclick = () => {
                    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                    swatch.classList.add('selected');
                    selectedColor = color;
                };
                paletteContainer.appendChild(swatch);
            });
        }

        // Renderizar SVG limpo e preciso
        function renderSVG(level, showColors = true) {
            const container = document.getElementById('svg-container');
            
            let svgHTML = `<svg viewBox="0 0 400 400">`;
            
            level.parts.forEach(part => {
                let fillColor = '#FFFFFF';
                
                if (showColors) {
                    fillColor = part.correctColor;
                } else {
                    fillColor = userColors[part.id] || '#FFFFFF';
                }

                // Construção das formas
                if (part.type === 'circle') {
                    svgHTML += `<circle id="${part.id}" class="colorable" cx="${part.cx}" cy="${part.cy}" r="${part.r}" fill="${fillColor}" onclick="colorPart('${part.id}')" />`;
                } else if (part.type === 'ellipse') {
                    svgHTML += `<ellipse id="${part.id}" class="colorable" cx="${part.cx}" cy="${part.cy}" rx="${part.rx}" ry="${part.ry}" fill="${fillColor}" onclick="colorPart('${part.id}')" />`;
                } else if (part.type === 'rect') {
                    svgHTML += `<rect id="${part.id}" class="colorable" x="${part.x}" y="${part.y}" width="${part.width}" height="${part.height}" rx="${part.rx || 0}" fill="${fillColor}" onclick="colorPart('${part.id}')" />`;
                } else if (part.type === 'path') {
                    svgHTML += `<path id="${part.id}" class="colorable" d="${part.d}" fill="${fillColor}" onclick="colorPart('${part.id}')" />`;
                }
            });

            // Adiciona linhas de expressão e detalhes fixos (olhos, boca, etc)
            if (level.extraDetails) {
                svgHTML += level.extraDetails;
            }

            svgHTML += `</svg>`;
            container.innerHTML = svgHTML;
        }

        // Colorir parte clicada
        function colorPart(partId) {
            if (isMemorizingPhase) return;
            
            userColors[partId] = selectedColor;
            const element = document.getElementById(partId);
            if (element) {
                element.setAttribute('fill', selectedColor);
            }
        }

        // Iniciar Fase
        function startLevel() {
            const level = LEVELS[currentLevelIndex];
            userColors = {};
            isMemorizingPhase = true;

            // Atualizar UI
            document.getElementById('level-display').innerText = currentLevelIndex + 1;
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('check-btn').classList.add('hidden');
            document.getElementById('palette').style.pointerEvents = 'none';

            // Mostrar SVG Colorido
            renderSVG(level, true);

            // Iniciar Timer de 5 Segundos
            let timeLeft = 50; 
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.width = '100%';

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerBar.style.width = (timeLeft * 2) + '%';

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    hideColorsAndStartPainting();
                }
            }, 100);
        }

        // Ocultar cores e permitir pintura
        function hideColorsAndStartPainting() {
            isMemorizingPhase = false;
            const level = LEVELS[currentLevelIndex];

            // Renderizar em branco
            renderSVG(level, false);

            // Habilitar paleta e botão
            document.getElementById('palette').style.pointerEvents = 'auto';
            document.getElementById('check-btn').classList.remove('hidden');
        }

        // Verificar Resposta
        function checkAnswer() {
            const level = LEVELS[currentLevelIndex];
            let correctCount = 0;
            let totalParts = level.parts.length;

            level.parts.forEach(part => {
                if (userColors[part.id] && userColors[part.id].toUpperCase() === part.correctColor.toUpperCase()) {
                    correctCount++;
                }
            });

            const accuracy = correctCount / totalParts;
            const overlay = document.getElementById('overlay');
            const title = document.getElementById('overlay-title');
            const msg = document.getElementById('overlay-msg');
            const btn = document.getElementById('start-btn');

            if (accuracy >= 0.7) { // 70% acerto
                score += Math.round(accuracy * 100);
                document.getElementById('score-display').innerText = score;

                if (currentLevelIndex < LEVELS.length - 1) {
                    title.innerText = "Muito Bem! 🎉";
                    msg.innerText = `Você acertou ${correctCount} de ${totalParts} cores!\nPronto para o próximo desenho fofo?`;
                    btn.innerText = "Próxima Fase";
                    btn.onclick = () => {
                        currentLevelIndex++;
                        startLevel();
                    };
                } else {
                    title.innerText = "Parabéns! Você Venceu! 🏆🐻";
                    msg.innerText = `Você completou todas as 15 fases estilo Bobbie Goods!\nSua pontuação total foi: ${score} pontos!`;
                    btn.innerText = "Jogar Novamente";
                    btn.onclick = () => {
                        currentLevelIndex = 0;
                        score = 0;
                        document.getElementById('score-display').innerText = score;
                        startLevel();
                    };
                }
            } else {
                title.innerText = "Ops! Quase lá! 🙈";
                msg.innerText = `Você acertou apenas ${correctCount} de ${totalParts} cores.\nTente memorizar com mais atenção!`;
                btn.innerText = "Tentar Novamente";
                btn.onclick = () => {
                    startLevel();
                };
            }

            overlay.classList.remove('hidden');
        }

        // Inicializar o Jogo ao Carregar
        window.onload = () => {
            initPalette();
            renderSVG(LEVELS[0], false);
        };
    </script>
</body>
</html>
